<div class="enrollment">
  <h2>Course Enrollment Form</h2>
  <div class="success" *ngIf="successMessage">{{ successMessage }}</div>
  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
    <div class="form-group"><label>Full Name</label><input formControlName="studentName" placeholder="Enter your name"/><span class="error" *ngIf="submitted && f['studentName'].errors?.['required']">Name is required</span><span class="error" *ngIf="submitted && f['studentName'].errors?.['minlength']">Min 3 characters</span></div>
    <div class="form-group"><label>Email</label><input formControlName="email" type="email" placeholder="Enter email"/><span class="error" *ngIf="submitted && f['email'].errors?.['required']">Email is required</span><span class="error" *ngIf="submitted && f['email'].errors?.['email']">Invalid email</span></div>
    <div class="form-group"><label>Select Course</label><select formControlName="courseId"><option value="">-- Select a course --</option><option *ngFor="let course of courses" [value]="course.id">{{ course.title }} ({{ course.credits }} credits)</option></select><span class="error" *ngIf="submitted && f['courseId'].errors?.['required']">Please select a course</span></div>
    <div class="form-group"><label>Reason for Enrollment</label><textarea formControlName="reason" placeholder="Why do you want to enroll?"></textarea><span class="error" *ngIf="submitted && f['reason'].errors?.['required']">Reason is required</span><span class="error" *ngIf="submitted && f['reason'].errors?.['minlength']">Min 10 characters</span></div>
    <button type="submit" class="btn-submit">Submit Enrollment</button>
  </form>
</div>
